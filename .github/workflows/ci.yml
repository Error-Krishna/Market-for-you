name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-aura-4u-frontend-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: market-aura-4u-frontend-main/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Run frontend Vitest suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend (Lint & Unit/Route Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            market-aura-4u-backend-main/package-lock.json

      - name: Install root tooling dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: market-aura-4u-backend-main
        run: npm ci

      - name: Lint backend JavaScript
        run: npm run lint:backend

      - name: Run backend CI test suite
        working-directory: market-aura-4u-backend-main
        run: npm run test:ci

  ml-recommender:
    name: ML Recommender Service (CAPSTONE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CAPSTONE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CAPSTONE/requirements-prod.txt

      - name: Install ML dependencies & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Run CAPSTONE test suite
        run: pytest -q tests/test_pipeline.py tests/test_serve.py tests/test_slim_runtime.py

  ci-gate:
    name: All Checks Passed
    needs: [frontend, backend, ml-recommender]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.ml-recommender.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "Frontend, Backend, and ML Recommender checks all passed."
