# ==============================================================================
# Market Aura 4U — Render Infrastructure as Code (Blueprint)
# Defines Node.js Backend API and optional Python ML Recommender Service.
# Frontend is deployed independently on Vercel (https://<project>.vercel.app).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Express API (Primary Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: market-aura-api
    runtime: node
    rootDir: market-aura-4u-backend-main
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUBLIC_BACKEND_URL
        sync: false # e.g. https://<market-aura-api>.onrender.com
      - key: FRONTEND_URL
        sync: false # e.g. https://<market-aura-project>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://<market-aura-project>.vercel.app
      - key: CHECKOUT_ENABLED
        value: "true"
      - key: AUTH_PROXY_MODE
        value: direct
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: MONGO_MAX_POOL_SIZE
        value: "20"
      - key: JWT_SECREAT_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        sync: false # Optional alias
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MEDIA_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false # Optional custom endpoint override
      - key: R2_PUBLIC_BASE_URL
        sync: false # Public HTTPS URL (e.g. https://media.marketaura4u.com or https://pub-xxx.r2.dev)
      - key: R2_REGION
        value: auto
      - key: MEDIA_STORAGE_PREFIX
        value: media
      - key: MEDIA_UPLOADS_ENABLED
        value: "true"
      - key: MEDIA_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MEDIA_USER_STORAGE_QUOTA_BYTES
        value: "104857600"
      - key: MEDIA_USER_MONTHLY_UPLOAD_LIMIT
        value: "100"
      - key: CRON_SECRET
        generateValue: true
      - key: META_UNIFIED_CONFIG_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTER_REDIRECT_URI
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RECOMMENDER_URL
        fromService:
          type: web
          name: market-aura-ml
          property: host
          path: /recommend
      - key: RECOMMENDER_HEALTH_URL
        fromService:
          type: web
          name: market-aura-ml
          property: host
          path: /health
      - key: RECOMMENDER_AUTH_MODE
        value: none
      - key: RECOMMENDER_TIMEOUT_MS
        value: 30000

  # ----------------------------------------------------------------------------
  # 2. Python ML Recommendation Engine (Optional Microservice)
  # ----------------------------------------------------------------------------
  - type: web
    name: market-aura-ml
    runtime: docker
    dockerfilePath: CAPSTONE/Dockerfile
    dockerContext: CAPSTONE
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: RECOMMENDER_HOST
        value: 0.0.0.0
      - key: HF_HUB_OFFLINE
        value: "1"

  # ----------------------------------------------------------------------------
  # OPTIONAL FALLBACK: Frontend Web SPA on Render
  # (Uncomment ONLY if you wish to host the frontend on Render instead of Vercel)
  # ----------------------------------------------------------------------------
  # - type: web
  #   name: market-aura-web
  #   runtime: static
  #   rootDir: market-aura-4u-frontend-main
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
