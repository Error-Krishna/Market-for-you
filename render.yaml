# ==============================================================================
# Market Aura 4U — Render Infrastructure as Code (Blueprint)
# Defines Web SPA, Node.js Backend API, and Python ML Recommender Service
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web SPA
  # ----------------------------------------------------------------------------
  - type: web
    name: market-aura-web
    runtime: static
    rootDir: market-aura-4u-frontend-main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: market-aura-api
          property: host
          path: /api

  # ----------------------------------------------------------------------------
  # 2. Backend Express API
  # ----------------------------------------------------------------------------
  - type: web
    name: market-aura-api
    runtime: node
    rootDir: market-aura-4u-backend-main
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CHECKOUT_ENABLED
        value: "true"
      - key: AUTH_PROXY_MODE
        value: direct
      - key: MONGO_URI
        sync: false # Set via Render dashboard or environment secret
      - key: JWT_SECREAT_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: RECOMMENDER_URL
        fromService:
          type: web
          name: market-aura-ml
          property: host
          path: /recommend
      - key: RECOMMENDER_HEALTH_URL
        fromService:
          type: web
          name: market-aura-ml
          property: host
          path: /health
      - key: RECOMMENDER_AUTH_MODE
        value: none
      - key: RECOMMENDER_TIMEOUT_MS
        value: 30000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: market-aura-web
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: market-aura-web
          property: host

  # ----------------------------------------------------------------------------
  # 3. Python ML Recommendation Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: market-aura-ml
    runtime: docker
    dockerfilePath: CAPSTONE/Dockerfile
    dockerContext: CAPSTONE
    healthCheckPath: /health
    plan: standard
    envVars:
      - key: PORT
        value: 8080
      - key: RECOMMENDER_HOST
        value: 0.0.0.0
      - key: HF_HUB_OFFLINE
        value: "1"
