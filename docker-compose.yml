# ==============================================================================
# Market Aura 4U — Monorepo Docker Compose
# Orchestrates all 4 system tiers: MongoDB, ML Engine, Node Backend, and React Web
# ==============================================================================

version: "3.8"

networks:
  market_aura_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: market-aura-mongodb
    restart: unless-stopped
    networks:
      - market_aura_net
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=market_aura
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. ML Recommendation Engine (Python 3.11 / scikit-learn / embeddings)
  # ----------------------------------------------------------------------------
  ml-recommender:
    build:
      context: ./CAPSTONE
      dockerfile: Dockerfile
    container_name: market-aura-ml
    restart: unless-stopped
    networks:
      - market_aura_net
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_HOST=0.0.0.0
      - HF_HUB_OFFLINE=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Backend API (Node.js 22 LTS / Express 5)
  # ----------------------------------------------------------------------------
  api-backend:
    build:
      context: ./market-aura-4u-backend-main
      dockerfile: Dockerfile
    container_name: market-aura-backend
    restart: unless-stopped
    networks:
      - market_aura_net
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      ml-recommender:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/market_aura
      - RECOMMENDER_URL=http://ml-recommender:8080/recommend
      - RECOMMENDER_HEALTH_URL=http://ml-recommender:8080/health
      - RECOMMENDER_AUTH_MODE=none
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:3000
      - PUBLIC_BACKEND_URL=http://localhost:8000
      - AUTH_PROXY_MODE=direct
      - CHECKOUT_ENABLED=true
      - JWT_SECREAT_KEY=${JWT_SECREAT_KEY:-production_jwt_secret_change_in_env_file_minimum_32_chars}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Frontend Web SPA (Nginx Alpine / React 19 / Vite 8)
  # ----------------------------------------------------------------------------
  frontend-web:
    build:
      context: ./market-aura-4u-frontend-main
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: market-aura-frontend
    restart: unless-stopped
    networks:
      - market_aura_net
    ports:
      - "3000:80"
    depends_on:
      api-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
